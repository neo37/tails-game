<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хвосты</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="play.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>

<canvas id="scene"></canvas>

<div id="hud">
  <div class="hud-left">
    <div class="stat big" id="tails-box"><span id="tails">🎀🎀🎀🎀🎀</span></div>
    <div class="stat" title="Мои ракушки">🐚 <b id="shells">0</b></div>
    <button class="stat shop-btn" id="btn-shop" type="button" title="Магазин: золото копится за волны и уровни">🛒 Магазин · 🪙 <b id="gold">0</b></button>
    <div class="stat" id="lives-box" title="Жизни персонажа: удар стоит жизнь, а побеждённый монстр их даёт" hidden>❤️ <b id="lives">10</b></div>
  </div>
  <div class="hud-center">
    <div class="wave-chip">Волна <b id="wave-num">—</b> <span id="wave-place"></span></div>
  </div>
  <div class="hud-right">
    <button id="btn-cam" class="round" title="Общий вид" hidden>🗺</button>
    <button id="btn-voice" class="round" title="Голос">🔊</button>
    <a class="round" id="btn-home" href="index.html" title="Домой">🏠</a>
    <div class="stat small" title="Рекорд">🏆 <b id="best">0</b></div>
  </div>
</div>

<div id="team"></div>

<div id="big-buttons">
  <button id="btn-here" class="huge ghost" hidden title="E">🧱 Строить тут</button>
  <button id="btn-jump" class="huge ghost" hidden title="Пробел. Прыгай сразу при приземлении — разгонишься">🤸 Прыжок</button>
  <button id="btn-hit" class="huge fight" hidden title="Q. Удар стоит жизнь, побеждённый монстр даёт жизни, но не ракушки">👊 Удар</button>
  <button id="btn-dance" class="huge rose">💃 Танцуем!</button>
  <button id="btn-pvp" class="huge fight" hidden title="X. Удар по союзнику: отбирает его ракушки">🥊 Союзника</button>
  <button id="btn-grow" class="huge ghost" hidden title="G">👻 Подрасти</button>
  <button id="btn-wave" class="huge">🌊 Волна!</button>
</div>

<div id="spin"><button id="spin-left" type="button" aria-label="Повернуть сцену влево">⟲</button><button id="spin-right" type="button" aria-label="Повернуть сцену вправо">⟳</button></div>
<div id="joy"><i></i></div>
<div id="hop" hidden></div>
<div id="combo" hidden></div>

<div id="build"></div>
<div id="shop" role="dialog" aria-label="Магазин">
  <div class="shop-card">
    <div class="shop-head"><h2>🛒 Магазин</h2><span class="shop-have">🪙 <b id="shop-gold">0</b></span><button id="shop-close" class="round" type="button" title="Закрыть">✕</button></div>
    <div class="shop-tabs"><button class="shop-tab on" type="button" data-tab="cannons">💥 Пушки</button><button class="shop-tab" type="button" data-tab="items">👒 Персонажам</button></div>
    <p class="shop-hint">Золото 🪙 — 10 за каждую волну и 50 за пройденный уровень. Покупки остаются навсегда.</p>
    <div id="shop-list"></div>
  </div>
</div>
<div id="secret-box" role="dialog" aria-label="Секрет">
  <div class="secret-card">
    <div class="secret-burst">🎉🎁🎉</div>
    <h2>Поздравляем!</h2>
    <p>Ты открыла <b>Секрет</b>! Внутри — подарок:</p>
    <div class="secret-gift">🪙 +1000 золота</div>
    <button id="secret-ok" class="huge" type="button">Ура!</button>
  </div>
</div>
<div id="toast"></div>

<div id="wait-host"><div class="tail-spin">🎀</div><p>Ждём ведущего игры…</p></div>

<div id="overlay">
  <h2 id="ov-title"></h2>
  <div id="ov-stars"></div>
  <p id="ov-text"></p>
  <div class="row" id="ov-buttons"></div>
</div>

<div id="loading">
  <div class="tail-spin">🎀</div>
  <div id="load-text">Собираем подружек на набережной…</div>
  <div class="bar"><i id="load-bar"></i></div>
</div>

<script type="module" src="src/kid-td.js"></script>
</body>
</html>
